# Copy to strait.properties (git-ignored). The publishable key (st_pub_...) is safe in an app; never the secret key.
STRAIT_PUBLISHABLE_KEY=st_pub_live_REPLACE_ME
# The default is Strait's test workspace for this example (com.straitlink.example + the Strait team's debug key).
# Use your own workspace's link domain; the manifest's App Links host follows it.
STRAIT_ENDPOINT=https://android-example.strait.link
