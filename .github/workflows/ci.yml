name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: ./gradlew test publishToMavenLocal --no-daemon
      - name: Example app builds against this source (examples/android)
        run: ./gradlew -p examples/android assembleDebug --no-daemon
      # R8 build only (no emulator here); scripts/r8-smoke.sh also runs it on a device (run it on the Mac).
      - name: Example app release build with R8 (minified)
        run: ./gradlew -p examples/android assembleRelease --no-daemon
      - run: node scripts/spec-vectors.mjs
      - run: node scripts/brand.mjs
